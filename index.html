<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./components/images/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tale of Cookies | Freshly Baked Comfort</title>
    
    <!-- Google Fonts: Fredoka -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-primary': '#69388B',
              'brand-secondary': '#FFD800',
              'brand-tertiary': '#A076C4',
            },
            fontFamily: {
                sans: ['Fredoka', 'sans-serif'],
                authenia: ['Authenia', 'cursive'],
            }
          }
        }
      }
    </script>
    <style>
      @font-face {
        font-family: 'Authenia';
        src: url('./Authenia.otf') format('opentype');
      }
      /* Custom scrollbar styles */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #69388B; /* Dark purple */
      }
      ::-webkit-scrollbar-thumb {
        background: #A076C4; /* Lighter purple */
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FFD800; /* Yellow */
      }
      body {
        background-image: url('./components/images/backgrounf.png'); 
        background-attachment: scroll; 
        background-size: 100% auto; 
        background-repeat: repeat-y; 
        background-position: center top;
      }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
  </body>
</html>
